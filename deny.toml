# cargo deny check.依赖的许可证,来源和重复版本都在这里把关,新增依赖要写明理由.
# tools/crosscheck/deps 走同一份配置.
# alloy-dyn-abi,alloy-json-abi =1.7.3 在 bitone-core 里:按描述文件解码调用数据和 EIP-712,MIT OR Apache-2.0,和 alloy-primitives 同一个仓库.
# 关掉默认特性,只开 std,eip712.alloy-sol-macro,syn-solidity,derive_more-impl 是过程宏,只在编译期运行.
# psbt-v2 =0.3.0 在 bitone-core 里:rust-bitcoin 组织,CC0-1.0,只依赖 bitcoin.miniscript 只出现在锁文件里,不编译.
# alloy-consensus,alloy-eips =2.5.0,alloy-primitives =1.7.3,alloy-rlp =0.3.17 在 bitone-core 里:EVM 的官方类型,MIT OR Apache-2.0,
# 关掉默认特性,不启用 k256,kzg,serde.授权人恢复用现有的 secp256k1.
# prost =0.14.4 在 bitone-core 里:解码 TRON,Apache-2.0,纯 Rust,没有 C 依赖.类型由 tools/protogen 从 schemas/ 生成.
# prost-derive 是过程宏,itertools 只跟着它,都不进产物.bytes 已经由 alloy 带入.
# solana-vote-interface =7.3.0,solana-loader-v4-interface =3.1.0,solana-ed25519-program =3.0.0,solana-zk-elgamal-proof-interface =1.0.0,
# solana-sdk-ids =3.1.0 在 bitone-core 里:没有官方 IDL 的 Solana 原生程序按这些官方类型解码,Apache-2.0,只开 serde.
# bincode =1.3.3 是这些程序读指令数据的方式,MIT.bytemuck =1.25.2,num-traits =0.2.19 读定长的官方结构体和枚举编号.
# solana-secp256k1-program 带进 k256 的系统随机数,solana-secp256r1-program 在手机上带进 OpenSSL,都不用.

[graph]
targets = [
    "aarch64-linux-android",
    "x86_64-linux-android",
    "aarch64-apple-ios",
    "wasm32-unknown-unknown",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]

[advisories]
yanked = "deny"
ignore = [
    # UniFFI 生成绑定时读配置用,不进运行时.UniFFI 换掉它之后删除这条.
    { id = "RUSTSEC-2026-0374", reason = "UniFFI 的构建期依赖" },
    # paste 只是作者停止维护,没有漏洞.它是 alloy-primitives 的过程宏,只在编译期运行,不进产物.alloy 换掉它之后删除这条.
    { id = "RUSTSEC-2024-0436", reason = "alloy-primitives 的编译期过程宏" },
    # bincode 只是作者停止维护,没有漏洞.Vote 和 Loader v4 的官方指令就是它的编码,链上程序也用 1.3.3 读,解码时设了一笔交易的长度上限.
    { id = "RUSTSEC-2025-0141", reason = "Solana 原生程序指令的官方编码" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# 工作区内部的 path 依赖没有版本号.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "CC0-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "BlueOak-1.0.0",
    "MITNFA",
]
confidence-threshold = 0.9

[licenses.private]
# 工作区自己的 crate 不发布,不检查.
ignore = true

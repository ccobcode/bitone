# cargo deny check.依赖的许可证,来源和重复版本都在这里把关,新增依赖要写明理由.
# tools/crosscheck/deps 走同一份配置:alloy 解码 EVM,prost 解码 TRON,psbt-v2 解码 PSBT v2.见 docs/10-tx-decoding.md 第 6 节.
# psbt-v2 =0.3.0 已进入 bitone-core:rust-bitcoin 组织,CC0-1.0,只依赖 bitcoin.miniscript 只出现在锁文件里,不编译.

[graph]
targets = [
    "aarch64-linux-android",
    "x86_64-linux-android",
    "aarch64-apple-ios",
    "wasm32-unknown-unknown",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]

[advisories]
yanked = "deny"
ignore = [
    # UniFFI 生成绑定时读配置用,不进运行时.UniFFI 换掉它之后删除这条.
    { id = "RUSTSEC-2026-0374", reason = "UniFFI 的构建期依赖" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# 工作区内部的 path 依赖没有版本号.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "CC0-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "BlueOak-1.0.0",
    "MITNFA",
]
confidence-threshold = 0.9

[licenses.private]
# 工作区自己的 crate 不发布,不检查.
ignore = true

name: CI

on:
    push:
        branches: ["**"]
    pull_request:
    workflow_call:
    workflow_dispatch:

concurrency:
    group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    LLVM: /usr/bin

jobs:
    quality:
        name: Format & Copy
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: 22
            - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
              with:
                  distribution: microsoft
                  java-version: 21
            - run: npm install --global pnpm@12.4.2
            - run: make test-copy check-copy tokens-check format-check

    rust:
        name: Rust
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: 22
            - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      ~/.cargo/bin
                      target
                  key: rust-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
                  restore-keys: rust-
            - run: npm install --global pnpm@12.4.2
            - run: cargo install cargo-audit cargo-deny --locked
            - run: make test-rust lint audit

    web:
        name: Web
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
            - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      ~/.cargo/bin
                      target
                  key: web-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
                  restore-keys: web-
            - uses: ./.github/actions/web-tools
            - run: make test-web

    android:
        name: Android
        runs-on: ubuntu-24.04
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
            - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      ~/.cargo/bin
                      target
                  key: android-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
                  restore-keys: android-
            - uses: ./.github/actions/android-tools
            - run: make test-android

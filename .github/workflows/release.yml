name: Release

on:
    push:
        tags: ["v[0-9]+.[0-9]+.[0-9]+"]

concurrency:
    group: release-${{ github.ref }}

permissions:
    contents: read

# 发布构建不用缓存,缓存可能被其他分支的构建污染.
env:
    LLVM: /usr/bin
    IMAGE: ghcr.io/${{ github.repository }}

jobs:
    version:
        name: Check Version
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Tag must match Cargo.toml
              run: test "${GITHUB_REF_NAME#v}" = "$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"

    ci:
        name: CI
        needs: version
        uses: ./.github/workflows/ci.yml

    server:
        name: Package ${{ matrix.runner }}
        needs: ci
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 30
        strategy:
            fail-fast: true
            matrix:
                runner: [ubuntu-24.04, ubuntu-24.04-arm]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/web-tools
            - run: make dist-server VERSION="${GITHUB_REF_NAME#v}"
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: dist-${{ matrix.runner }}
                  path: dist/*.tar.gz
                  if-no-files-found: error

    android:
        name: Package Android
        needs: ci
        runs-on: ubuntu-24.04
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: ./.github/actions/android-tools
            - run: make dist-android VERSION="${GITHUB_REF_NAME#v}"
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: dist-android
                  path: dist/*.apk
                  if-no-files-found: error

    image:
        name: Image ${{ matrix.runner }}
        needs: ci
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 45
        permissions:
            contents: read
            packages: write
        strategy:
            fail-fast: true
            matrix:
                runner: [ubuntu-24.04, ubuntu-24.04-arm]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - env:
                  GH_TOKEN: ${{ github.token }}
              run: docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$GH_TOKEN"
            - run: |
                  tag="$IMAGE:${GITHUB_REF_NAME#v}-$(uname -m)"
                  docker build -f docker/selfhost.Dockerfile -t "$tag" .
                  docker push "$tag"

    # 这里只建草稿.APK 由 scripts/release.sh 在本地签名后转为正式发布,CI 不碰签名私钥.
    draft:
        name: Draft Release
        needs: [server, android, image]
        runs-on: ubuntu-24.04
        permissions:
            contents: write
            packages: write
        steps:
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  pattern: dist-*
                  path: dist
                  merge-multiple: true
            - env:
                  GH_TOKEN: ${{ github.token }}
              run: docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$GH_TOKEN"
            - id: image
              run: |
                  version="${GITHUB_REF_NAME#v}"
                  docker buildx imagetools create -t "$IMAGE:$version" "$IMAGE:$version-x86_64" "$IMAGE:$version-aarch64"
                  digest=$(docker buildx imagetools inspect "$IMAGE:$version" --format '{{json .Manifest.Digest}}' | tr -d '"')
                  echo "digest=$digest" >> "$GITHUB_OUTPUT"
            - env:
                  GH_TOKEN: ${{ github.token }}
                  DIGEST: ${{ steps.image.outputs.digest }}
              run: >-
                  gh release create "$GITHUB_REF_NAME" dist/*
                  --repo "$GITHUB_REPOSITORY"
                  --title "BitOne $GITHUB_REF_NAME"
                  --notes "Image: \`$IMAGE@$DIGEST\`"
                  --generate-notes
                  --draft
                  --verify-tag

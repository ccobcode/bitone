name: Release

on:
    push:
        tags: ["v[0-9]+.[0-9]+.[0-9]+"]

concurrency:
    group: release-${{ github.ref }}

permissions:
    contents: read

# 发布构建不用缓存，缓存可能被其他分支的构建污染。
env:
    LLVM: /usr/bin

jobs:
    version:
        name: Check Version
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
            - name: Tag must match Cargo.toml
              run: test "${GITHUB_REF_NAME#v}" = "$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"

    ci:
        name: CI
        needs: version
        uses: ./.github/workflows/ci.yml

    server:
        name: Package ${{ matrix.runner }}
        needs: ci
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 30
        strategy:
            fail-fast: true
            matrix:
                runner: [ubuntu-24.04, ubuntu-24.04-arm]
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
            - uses: ./.github/actions/web-tools
            - run: make dist-server VERSION="${GITHUB_REF_NAME#v}"
            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: dist-${{ matrix.runner }}
                  path: dist/*.tar.gz
                  if-no-files-found: error

    android:
        name: Package Android
        needs: ci
        runs-on: ubuntu-24.04
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
            - uses: ./.github/actions/android-tools
            - run: make dist-android VERSION="${GITHUB_REF_NAME#v}"
            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: dist-android
                  path: dist/*.apk
                  if-no-files-found: error

    publish:
        name: Publish
        needs: [server, android]
        runs-on: ubuntu-24.04
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
              with:
                  pattern: dist-*
                  path: dist
                  merge-multiple: true
            - run: cd dist && sha256sum * > SHA256SUMS
            - env:
                  GH_TOKEN: ${{ github.token }}
              run: >-
                  gh release create "$GITHUB_REF_NAME" dist/*
                  --repo "$GITHUB_REPOSITORY"
                  --title "BitOne $GITHUB_REF_NAME"
                  --generate-notes
                  --verify-tag

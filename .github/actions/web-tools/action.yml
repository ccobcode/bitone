name: Web tools
description: Node、pnpm、clang 和 wasm-bindgen。

runs:
    using: composite
    steps:
        - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
          with:
              node-version: 22
        - shell: bash
          run: npm install --global pnpm@12.4.2
        - shell: bash
          run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang llvm
        - shell: bash
          run: cargo install wasm-bindgen-cli --version 0.2.130 --locked

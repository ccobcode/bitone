# 对照工具在工作区之外,有自己的锁文件和工具链.见 docs/10-tx-decoding.md 第 6.4 节和第 8 节.
[package]
name = "crosscheck"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
bitcoin = { version = "=0.32.102", default-features = false, features = ["std"] }
bitone-core = { path = "../../crates/bitone-core" }
psbt-v2 = { version = "=0.3.0", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.11.1"

# 官方没有 Vote 的 IDL,schemas/solana/vote.json 是手写的,要和 interface crate 比较.不进产物.
[dev-dependencies]
solana-hash = "=4.7.0"
solana-instruction = "=4.0.0"
solana-pubkey = "=4.4.0"
solana-vote-interface = { version = "=7.3.0", features = ["bincode"] }

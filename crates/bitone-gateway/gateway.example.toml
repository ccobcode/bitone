# 用法：bitone-gateway --config gateway.example.toml
# 这是配置模板。本地要填 key 时复制成仓库根目录的 gateway.local.toml，这个文件不进 Git。
# 上游能看到查询的地址。介意的话换成自己的节点。
# 下面的键除 networks 外都可以省略，这里写的就是默认值。

listen = "127.0.0.1:8787"

# 自部署：取消注释后同进程托管网页端，目录里要有 index.html。
# web_dir = "/srv/bitone/web"

upstream_timeout_ms = 10000
ws_poll_interval_ms = 15000
ws_heartbeat_ms = 30000
rate_limit_burst = 1200
rate_limit_per_second = 20
ws_max_connections_per_ip = 64

# 部署在反向代理或负载均衡后面时，填代理的 IP。
# 只有来自这些 IP 的请求才读 X-Forwarded-For，默认不信任任何代理。
trusted_proxies = []

# 价格上游是 CoinGecko 的 simple/price 格式。删掉这一段后 /v1/prices 返回空。
# 键是 网络:合约，只接受主网资产，值是 CoinGecko 的资产 ID。
# 测试网资产由网页端按同链同符号的主网资产计价。
[prices]
url = "https://api.coingecko.com/api/v3/simple/price"
# api_key_header = "x-cg-demo-api-key"
# api_key = "你的 key"

[prices.ids]
"bitcoin:native" = "bitcoin"

[package]
name = "bitone-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
alloy-consensus = { version = "=2.5.0", default-features = false, features = ["std"] }
alloy-dyn-abi = { version = "=1.7.3", default-features = false, features = ["std", "eip712"] }
alloy-eips = { version = "=2.5.0", default-features = false, features = ["std"] }
alloy-json-abi = { version = "=1.7.3", default-features = false, features = ["std"] }
alloy-primitives = { version = "=1.7.3", default-features = false, features = ["std"] }
alloy-rlp = { version = "=0.3.17", default-features = false, features = ["std"] }
bincode = { version = "=1.3.3", default-features = false }
bytemuck = { version = "=1.25.2", default-features = false }
bitcoin = { workspace = true, features = ["secp-recovery"] }
ed25519-dalek = { version = "3", default-features = false, features = ["alloc"] }
minicbor.workspace = true
num-traits = { version = "=0.2.19", default-features = false }
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "pkcs8"] }
prost = { version = "=0.14.4", default-features = false, features = ["derive", "std"] }
psbt-v2 = { version = "=0.3.0", default-features = false, features = ["std"] }
qrcode.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sha3.workspace = true
solana-ed25519-program = { version = "=3.0.0", default-features = false }
solana-sdk-ids = { version = "=3.1.0", default-features = false }
solana-loader-v4-interface = { version = "=3.1.0", default-features = false, features = ["serde"] }
solana-vote-interface = { version = "=7.3.0", default-features = false, features = ["serde"] }
solana-zk-elgamal-proof-interface = { version = "=1.0.0", default-features = false }
thiserror.workspace = true
ur.workspace = true

[dev-dependencies]
solana-hash = { version = "=4.7.0", default-features = false }
solana-pubkey = { version = "=4.4.0", default-features = false }

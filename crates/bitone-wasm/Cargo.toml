[package]
name = "bitone-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bitone-core.workspace = true
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_bytes = "0.11"
wasm-bindgen = "0.2"
# 缩小 secp256k1 的预计算表.网页端只做公钥运算,不追求速度.
secp256k1 = { version = "0.29", default-features = false, features = ["lowmemory"] }
